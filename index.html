<body>
  <div id="app" class="app is-booting">
    <a class="skip-link" href="#view" data-i18n="a11y.skipToContent">Skip to content</a>

    <aside class="sidebar chrome" id="sidebar" data-i18n-attr="aria-label:a11y.mainNav">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">+</span>
        <div>
          <strong class="brand-name" data-i18n="app.name">Shifa Pharmacy POS</strong>
          <div class="brand-sub" id="pharmacy-name"></div>
        </div>
      </div>
      <nav aria-label="Main navigation" data-i18n-attr="aria-label:a11y.mainNav">
        <ul class="nav-list" id="nav-list"></ul>
      </nav>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main-wrap">
      <header class="app-header chrome">
        <button type="button" class="btn btn-ghost icon-btn menu-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false" data-i18n-attr="aria-label:a11y.openMenu">
          <span data-icon="menu"></span>
        </button>
        <h1 class="page-title" id="page-title"></h1>
        <div class="header-actions">
          <button type="button" class="status-pill" id="net-status" aria-live="polite"></button>
          <button type="button" class="pill-btn" id="install-btn" data-i18n="header.installApp" hidden></button>
          <button type="button" class="pill-btn" id="lang-btn" data-i18n="lang.switch">اردو</button>
          <div class="avatar-wrap" id="avatar-wrap">
            <button type="button" class="avatar" id="avatar-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="avatar-menu" data-i18n-attr="aria-label:menu.account">
              <span id="avatar-initials">?</span>
            </button>
            <div class="avatar-menu glass" id="avatar-menu" role="menu" hidden>
              <p class="avatar-who" id="avatar-who"></p>
              <button type="button" role="menuitem" class="menu-item" data-go="/settings" data-i18n="menu.settings">Settings</button>
              <button type="button" role="menuitem" class="menu-item" id="menu-lang" data-i18n="menu.language">Language</button>
              <button type="button" role="menuitem" class="menu-item danger" id="logout-btn" data-i18n="menu.logout">Log out</button>
            </div>
          </div>
        </div>
      </header>

      <div class="banner banner-warn" id="offline-banner" role="status" hidden data-i18n="net.offlineBanner"></div>

      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav chrome" id="bottom-nav" data-i18n-attr="aria-label:a11y.bottomNav">
      <ul id="bottom-list"></ul>
    </nav>

    <div class="loading-bar" id="loading-bar" aria-hidden="true"></div>
    <div class="toast-root" id="toast-root" aria-live="polite"></div>
    <div class="modal-root" id="modal-root"></div>
  </div>

  <noscript>Shifa Pharmacy POS needs JavaScript to run.</noscript>
  <!-- jQuery 3.7.1 is served from /vendor: same origin, deferred, works offline. (The cdnjs copy is not used
       because its extra connection and render-blocking fallback cost first paint. See docs/MOTION.md.) -->
  <script defer src="vendor/jquery.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
